[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "receiptgate"
version = "0.0.1"
description = "State-bound command receipts and deterministic local gates"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Mika Mischke"}]
keywords = ["agents", "git", "audit", "receipts", "developer-tools"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.urls]
Repository = "https://github.com/luminosstudioai-creator/receiptgate"
Issues = "https://github.com/luminosstudioai-creator/receiptgate/issues"

[project.scripts]
receiptgate = "receiptgate.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.16.10", "mypy==2.4.0", "coverage==7.16.2", "build==1.6.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["receiptgate"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
